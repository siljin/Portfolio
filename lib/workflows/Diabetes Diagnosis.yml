            confidence is limited and why. Do not alarm the patient unnecessarily.]


            ---


            ## Key Risk Factors Identified

            [Bulleted list of the specific risk factors found in the patient data]


            ---


            ## Social Factors Affecting Your Risk

            [Bulleted list of SDOH flags and a one sentence explanation of how each
