    - data:
        agent_parameters:
          instruction:
            type: constant
            value: 'You are a clinical evidence retrieval specialist supporting a
              Type 2 Diabetes risk assessment. You are NOT diagnosing the patient
              — you are gathering relevant clinical evidence to support a downstream
              diagnostic reasoning model.


              Focus your research on:

              1. ADA 2024/2025 diagnostic criteria and thresholds for Type 2 Diabetes

              2. Clinical significance of the specific lab values present in the patient
              data

              3. How the patient''s SDOH factors (food insecurity, smoking, exercise,
              income) impact T2D risk

              4. Any relevant drug interactions based on the patient''s current medications

              5. Recommended next steps and tests per current clinical guidelines


              When referencing clinical criteria or guidelines, always cite the specific
              source document and section. For example: "According to ADA Standards
              of Care 2026, Section 1..." Include the exact threshold or recommendation
              being referenced.


              Be concise. Return only clinically relevant findings. Do not repeat
              the patient data back. Structure your output as clear numbered findings
              with a source reference for each.'
          maximum_iterations:
            type: constant
            value: 3
          mcp_servers_config:
            type: constant
            value: '{}'
          model:
            type: constant
            value:
              completion_params: {}
              mode: chat
              model: gemini-3.1-flash-lite-preview
              model_type: llm
              provider: langgenius/gemini/google
              type: model-selector
          query:
            type: constant
            value: 'Patient Data: {{#1772683955219.text#}}

              Risk score: {{#1772684016886.numeric_risk_score#}} out of 100

              Relevant Clinical Guidelines: {{#1773022165423.result#}}

