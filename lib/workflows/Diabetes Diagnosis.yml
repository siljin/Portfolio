    - data:
        code: "import json\nimport re\n\ndef main(structured_json: str) -> dict:\n\
          \n    try:\n        # Handle escaped newlines and whitespace\n        cleaned\
          \ = structured_json.encode().decode('unicode_escape') if '\\\\n' in structured_json\
          \ else structured_json\n        \n        # Strip markdown fences if present\n\
          \        cleaned = re.sub(r\"```json|```\", \"\", cleaned).strip()\n   \
          \     \n        # Extract just the JSON object if extra text is present\n\
          \        match = re.search(r'\\{.*\\}', cleaned, re.DOTALL)\n        if\
          \ match:\n            cleaned = match.group()\n        \n        data =\
          \ json.loads(cleaned)\n\n    except Exception as e:\n        # Try direct\
          \ parse as fallback\n        try:\n            match = re.search(r'\\{.*\\\
          }', structured_json, re.DOTALL)\n            if match:\n               \
          \ data = json.loads(match.group())\n            else:\n                raise\
          \ ValueError(\"No JSON found\")\n        except Exception:\n           \
          \ return {\n                \"numeric_risk_score\": 0,\n               \
          \ \"risk_category\": \"unknown\",\n                \"sufficient_data\":\
          \ \"no\",\n                \"missing_fields\": str(e)\n            }\n\n\
          \    labs = data.get(\"medical_history\", {}).get(\"labs\", {})\n    history\
          \ = data.get(\"medical_history\", {})\n    sdoh = data.get(\"sdoh\", {})\n\
          \    missing = data.get(\"missing_critical_fields\", [])\n\n    critical\
          \ = [\"hba1c\", \"fasting_glucose\", \"bmi\", \"bp_systolic\"]\n    if all(f\
          \ in missing for f in critical):\n        return {\n            \"numeric_risk_score\"\
          : 0,\n            \"risk_category\": \"insufficient_data\",\n          \
          \  \"sufficient_data\": \"no\",\n            \"missing_fields\": \", \"\
          .join(missing)\n        }\n\n    score = 0\n\n    hba1c = labs.get(\"hba1c\"\
          )\n    if hba1c is not None:\n        if hba1c >= 6.5:\n            score\
          \ += 40\n        elif hba1c >= 5.7:\n            score += 20\n\n    glucose\
          \ = labs.get(\"fasting_glucose\")\n    if glucose is not None:\n       \
          \ if glucose >= 126:\n            score += 30\n        elif glucose >= 100:\n\
          \            score += 15\n\n    bmi = labs.get(\"bmi\")\n    if bmi is not\
          \ None:\n        if bmi >= 30:\n            score += 10\n        elif bmi\
          \ >= 25:\n            score += 5\n\n    age = data.get(\"age\")\n    if\
          \ age is not None:\n        if age >= 45:\n            score += 5\n\n  \
          \  family = history.get(\"family_history\", [])\n    family_text = \" \"\
          .join(family).lower()\n    if \"diabetes\" in family_text or \"diabetic\"\
          \ in family_text:\n        score += 8\n\n    if sdoh.get(\"food_security\"\
          ) == \"insecure\":\n        score += 4\n    if sdoh.get(\"smoking\") ==\
          \ \"current\":\n        score += 3\n    exercise = sdoh.get(\"exercise\"\
          , \"\")\n    if exercise and any(word in exercise.lower() for word in [\"\
          never\", \"sedentary\", \"none\", \"no exercise\", \"rarely\"]):\n     \
          \   score += 4\n\n    score = min(score, 100)\n\n    if score >= 60:\n \
          \       risk_category = \"high\"\n    elif score >= 30:\n        risk_category\
          \ = \"moderate\"\n    else:\n        risk_category = \"low\"\n\n    return\
          \ {\n        \"numeric_risk_score\": score,\n        \"risk_category\":\
          \ risk_category,\n        \"sufficient_data\": \"yes\",\n        \"missing_fields\"\
          : \", \".join(missing) if missing else \"none\"\n    }"
        code_language: python3
        outputs:
          missing_fields:
            children: null
            type: string
          numeric_risk_score:
            children: null
            type: number
          risk_category:
            children: null
            type: string
          sufficient_data:
            children: null
            type: string
