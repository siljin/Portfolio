            Note that this report is generated from a moderate or low confidence assessment
            — meaning the available data was insufficient to reach a definitive conclusion.
            Reflect this honestly but gently in the report.


            Format the report exactly like this:


            ## Type 2 Diabetes Risk Assessment


            **Diagnostic Prediction:** LIKELY HAS TYPE 2 DIABETES or UNLIKELY TO HAVE
            TYPE 2 DIABETES

            **Confidence Level:** X out of 10

            **Assessment Status:** Inconclusive — Additional Information Required


            ---


