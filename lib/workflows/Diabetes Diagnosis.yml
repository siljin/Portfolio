            with the full source name and section. For example: "ADA Standards of
            Care 2026, Section 1 — HbA1c ≥ 6.5% meets diagnostic threshold for Type
            2 Diabetes." Make citations readable for a non-medical audience while
            keeping them specific enough for a physician to verify.

            ---


            ## Protective Factors

            [Bulleted list of contradicting or protective factors — things working
            in the patient''s favor]


            ---


            ## Your Physician Should Check

            [Ordered list of tests and exams from the diagnostic output, most urgent
            first]


            ---


            ## Additional Tests Needed to Improve Certainty

            [This section is specific to low and moderate confidence cases. List the
            top 5 additional tests or assessments the physician should order to reach
            a more definitive diagnosis. For each one explain in plain English why
            it is needed for this specific patient based on their data and what missing
            information it would provide.]


            ---


            ## Important Disclaimer

            This report is generated by an AI-assisted clinical decision support tool
            and does not constitute a medical diagnosis. All findings must be reviewed
            and confirmed by a licensed physician before any clinical decisions are
            made.'
