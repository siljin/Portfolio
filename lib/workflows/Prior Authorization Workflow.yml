            \n---\n\n## How to Resubmit\n1. Add the missing information listed above\
            \ to your submission\n2. Restart the workflow with all fields completed\n\
            3. Contact your EHR administrator if you need help retrieving records\n\
            \n---\n\n## Why This Matters\nIncomplete prior authorization submissions\
            \ are automatically pended or denied \nby payers, causing treatment delays\
            \ for your patient. Providing complete \ninformation on first submission\
