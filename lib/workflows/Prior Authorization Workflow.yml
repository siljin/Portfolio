    - data:
        code: "import json\nimport re\n\ndef main(intake_json: str) -> dict:\n\n \
          \   try:\n        cleaned = re.sub(r\"```json|```\", \"\", intake_json).strip()\n\
          \        match = re.search(r'\\{.*\\}', cleaned, re.DOTALL)\n        data\
          \ = json.loads(match.group()) if match else json.loads(cleaned)\n    except\
          \ Exception as e:\n        return {\n            \"can_proceed\": \"no\"\
          ,\n            \"missing_summary\": \"Could not parse intake data. Please\
          \ check inputs.\",\n            \"completeness_score\": 0\n        }\n\n\
          \    patient  = data.get(\"patient\", {})\n    request  = data.get(\"request\"\
          , {})\n    clinical = data.get(\"clinical_context\", {})\n\n    has_clinical\
          \ = (\n        bool(clinical.get(\"physician_justification\")) or\n    \
          \    bool(clinical.get(\"primary_symptoms\")) or\n        bool(clinical.get(\"\
          duration_of_condition\")) or\n        bool(clinical.get(\"prior_treatments_tried\"\
          )) or\n        len(intake_json) > 300\n    )\n\n    checks = {\n       \
          \ \"Age\":            bool(patient.get(\"age\")),\n        \"ICD-10 code\"\
          :    bool(request.get(\"icd10_code\")),\n        \"CPT code\":       bool(request.get(\"\
          cpt_code\")),\n        \"Clinical notes\": has_clinical,\n    }\n\n    failed\
          \ = [k for k, v in checks.items() if not v]\n    failed = list(dict.fromkeys(failed))\n\
          \n    score = round((1 - len(failed) / len(checks)) * 100)\n\n    if failed:\n\
          \        return {\n            \"can_proceed\": \"no\",\n            \"\
          missing_summary\": \"Missing: \" + \", \".join(failed),\n            \"\
          completeness_score\": score\n        }\n\n    return {\n        \"can_proceed\"\
          : \"yes\",\n        \"missing_summary\": \"All required fields present.\"\
          ,\n        \"completeness_score\": 100\n    }"
        code_language: python3
        outputs:
          can_proceed:
            children: null
            type: string
          completeness_score:
            children: null
            type: number
          missing_summary:
            children: null
            type: string
