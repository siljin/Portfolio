<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="A Lettersly round in progress: the riddle, six empty letter slots, the input tile, and three locked letter probes with their price">
  <defs>
    <linearGradient id="rsPetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa2f5" />
      <stop offset="100%" stop-color="#5b66d6" />
    </linearGradient>
    <linearGradient id="rsRiddle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f86e8" />
      <stop offset="50%" stop-color="#a6acf8" />
      <stop offset="100%" stop-color="#7f86e8" />
    </linearGradient>
    <linearGradient id="rsPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151d2b" />
      <stop offset="100%" stop-color="#101724" />
    </linearGradient>
    <linearGradient id="rsPill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222d3f" />
      <stop offset="100%" stop-color="#1a2331" />
    </linearGradient>
    <linearGradient id="rsLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa2f5" />
      <stop offset="100%" stop-color="#5b66d6" />
    </linearGradient>
    <radialGradient id="rsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4d5ac4" stop-opacity="0.40" />
      <stop offset="65%" stop-color="#2b3488" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0e1420" stop-opacity="0" />
    </radialGradient>
    <filter id="rsSoften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" />
    </filter>

    <g id="rsPetalShape">
      <ellipse cx="360" cy="52" rx="6.5" ry="20" fill="url(#rsPetal)" />
    </g>

    <!-- A closed padlock, reused for each unbought probe. -->
    <g id="rsLock">
      <path
        d="M -5 -1 a 5 5 0 0 1 10 0"
        fill="none"
        stroke="#7d879c"
        stroke-width="1.6"
        stroke-linecap="round"
      />
      <rect x="-6.5" y="-1" width="13" height="10" rx="2.4" fill="none" stroke="#7d879c" stroke-width="1.6" />
    </g>
  </defs>

  <rect width="720" height="520" fill="#0e1420" />
  <circle cx="360" cy="95" r="135" fill="url(#rsGlow)" />

  <!-- Blurred ring underneath, so the petals read as lit. -->
  <g filter="url(#rsSoften)" opacity="0.5">
    <use href="#rsPetalShape" />
    <use href="#rsPetalShape" transform="rotate(25.714 360 95)" />
    <use href="#rsPetalShape" transform="rotate(51.429 360 95)" />
    <use href="#rsPetalShape" transform="rotate(77.143 360 95)" />
    <use href="#rsPetalShape" transform="rotate(102.857 360 95)" />
    <use href="#rsPetalShape" transform="rotate(128.571 360 95)" />
    <use href="#rsPetalShape" transform="rotate(154.286 360 95)" />
    <use href="#rsPetalShape" transform="rotate(180 360 95)" />
    <use href="#rsPetalShape" transform="rotate(205.714 360 95)" />
    <use href="#rsPetalShape" transform="rotate(231.429 360 95)" />
    <use href="#rsPetalShape" transform="rotate(257.143 360 95)" />
    <use href="#rsPetalShape" transform="rotate(282.857 360 95)" />
    <use href="#rsPetalShape" transform="rotate(308.571 360 95)" />
    <use href="#rsPetalShape" transform="rotate(334.286 360 95)" />
  </g>

  <g>
    <use href="#rsPetalShape" />
    <use href="#rsPetalShape" transform="rotate(25.714 360 95)" />
    <use href="#rsPetalShape" transform="rotate(51.429 360 95)" />
    <use href="#rsPetalShape" transform="rotate(77.143 360 95)" />
    <use href="#rsPetalShape" transform="rotate(102.857 360 95)" />
    <use href="#rsPetalShape" transform="rotate(128.571 360 95)" />
    <use href="#rsPetalShape" transform="rotate(154.286 360 95)" />
    <use href="#rsPetalShape" transform="rotate(180 360 95)" />
    <use href="#rsPetalShape" transform="rotate(205.714 360 95)" />
    <use href="#rsPetalShape" transform="rotate(231.429 360 95)" />
    <use href="#rsPetalShape" transform="rotate(257.143 360 95)" />
    <use href="#rsPetalShape" transform="rotate(282.857 360 95)" />
    <use href="#rsPetalShape" transform="rotate(308.571 360 95)" />
    <use href="#rsPetalShape" transform="rotate(334.286 360 95)" />
  </g>

  <text
    x="360"
    y="186"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="23"
    fill="url(#rsRiddle)"
  >Your own body keeps me going even on</text>
  <text
    x="360"
    y="218"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="23"
    fill="url(#rsRiddle)"
  >the days you are trying hard not to.</text>

  <!-- Six letter slots; the third is cued as the active one. -->
  <g fill="#3d4557">
    <rect x="210" y="262" width="40" height="3" rx="1.5" />
    <rect x="262" y="262" width="40" height="3" rx="1.5" />
    <rect x="314" y="262" width="40" height="3" rx="1.5" fill="#7f86e8" />
    <rect x="366" y="262" width="40" height="3" rx="1.5" />
    <rect x="418" y="262" width="40" height="3" rx="1.5" />
    <rect x="470" y="262" width="40" height="3" rx="1.5" />
  </g>

  <!-- Input tile with a caret. -->
  <rect x="331" y="286" width="58" height="46" rx="12" fill="#1b2432" stroke="#59629b" stroke-width="1.5" />
  <rect x="359" y="298" width="2" height="22" rx="1" fill="#8b92f0" opacity="0.9" />

  <!-- The probe shelf: three unbought probes and what the next one costs. -->
  <rect x="110" y="352" width="500" height="150" rx="18" fill="url(#rsPanel)" stroke="#26303f" stroke-width="1.5" />

  <g>
    <circle cx="296" cy="404" r="25" fill="#131b28" stroke="#2f3a4c" stroke-width="1.5" />
    <g transform="translate(296 400)"><use href="#rsLock" /></g>
    <circle cx="360" cy="404" r="25" fill="#131b28" stroke="#3b4759" stroke-width="1.5" />
    <g transform="translate(360 400)"><use href="#rsLock" /></g>
    <circle cx="424" cy="404" r="25" fill="#131b28" stroke="#2f3a4c" stroke-width="1.5" />
    <g transform="translate(424 400)"><use href="#rsLock" /></g>
  </g>

  <!-- Price pill: one key, one leaf. -->
  <rect x="300" y="452" width="120" height="40" rx="20" fill="url(#rsPill)" stroke="#39445a" stroke-width="1.2" />
  <g transform="translate(334 472)" stroke="#8b92f0" stroke-width="1.7" fill="none" stroke-linecap="round">
    <circle cx="-6" cy="0" r="4.6" />
    <path d="M -1.6 -1.4 L 8 -1.4" />
    <path d="M 4.4 -1.4 L 4.4 2.6" />
    <path d="M 7.6 -1.4 L 7.6 1.6" />
  </g>
  <path d="M 386 460 C 393 466 393 478 386 485 C 379 478 379 466 386 460 Z" fill="url(#rsLeaf)" />
</svg>
